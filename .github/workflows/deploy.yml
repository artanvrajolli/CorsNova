name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  # Main deployment. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
  # repository secrets; the job is skipped until they are set.
  deploy-cloudflare:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v5

      - name: Install Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: cloudflare
        shell: bash
        # Repeat wrangler's error lines as annotations so they show on the run summary.
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/wrangler.log" || {
            grep -A4 'ERROR' "$RUNNER_TEMP/wrangler.log" | grep -v '^\s*$' | head -10 | sed 's/^/::error::/'
            exit 1
          }

      - name: Report skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, skipping the Cloudflare Workers deployment."

  # Secondary deployment. Runs independently of Cloudflare, so a Vercel
  # failure (for example paused deployments after the Fast Origin Transfer
  # quota is used up) does not block the main deployment. Remove the
  # VERCEL_TOKEN secret to turn it off.
  deploy-vercel:
    needs: test
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        if: env.VERCEL_TOKEN != ''
        uses: actions/checkout@v5

      - name: Install Node.js
        if: env.VERCEL_TOKEN != ''
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy project artifacts to Vercel
        if: env.VERCEL_TOKEN != ''
        shell: bash
        # Repeat the CLI's error lines as annotations so they show on the run summary.
        run: |
          set -o pipefail
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tee "$RUNNER_TEMP/vercel.log" || {
            grep -i -A4 'error' "$RUNNER_TEMP/vercel.log" | grep -v '^\s*$' | head -10 | sed 's/^/::error::/'
            exit 1
          }

      - name: Report skipped deployment
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN is not set, skipping the Vercel deployment."
